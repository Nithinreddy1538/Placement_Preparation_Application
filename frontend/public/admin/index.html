<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placement Prep - Admin Portal</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta http-equiv="refresh" content="0; url=/#/admin" />
    <script>
      (function() {
        var search = window.location.search || '';
        window.location.replace('/#/admin' + search);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #f0f9ff 0%, #fff7ed 50%, #fefce8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #0f172a;
      }
      .card {
        background: #ffffff;
        padding: 32px 28px;
        border-radius: 20px;
        box-shadow: 0 20px 45px -15px rgba(234, 88, 12, 0.18);
        border: 1.5px solid #fed7aa;
        text-align: center;
        max-width: 420px;
        width: 90%;
      }
      .btn {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 24px;
        background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
        color: #ffffff;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.95rem;
        box-shadow: 0 4px 12px rgba(234, 88, 12, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin: 0 0 10px; font-size: 1.3rem;">Opening Admin Portal...</h2>
      <p style="margin: 0 0 16px; color: #475569; font-size: 0.9rem;">
        Redirecting you to the Super Admin console. If not redirected automatically, click below:
      </p>
      <a href="/#/admin" class="btn">Enter Admin Portal &rarr;</a>
    </div>
  </body>
</html>
